<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Studio Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        header {
            margin-bottom: 25px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 5px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .upload-box {
            border: 2px dashed #3498db;
            padding: 20px;
            text-align: center;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            background: #ecfdf5;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .upload-box:hover {
            background: #e0f2fe;
        }
        input[type="file"] {
            display: none;
        }
        .preview-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            min-height: 200px;
            background: #D9F0FA;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            overflow: hidden;
            position: relative;
        }
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .placeholder-text {
            color: #64748b;
            font-size: 14px;
            position: absolute;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn-success {
            background-color: #27ae60;
        }
        .btn-success:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <header>
        <h1>Photo Studio Pro</h1>
        <p>পাসপোর্ট ও এনআইডি সাইজ ছবি প্রসেসিং অ্যাপ</p>
    </header>

    <div class="container">
        <!-- Upload Area -->
        <label class="upload-box" for="imageInput">
            <strong>📁 ছবি আপলোড করতে এখানে ক্লিক করুন</strong>
            <p style="margin-top: 5px; font-size: 12px;">জেপিজি বা পিএনজি ফাইল</p>
        </label>
        <input type="file" id="imageInput" accept="image/*">

        <!-- Preview Area -->
        <div class="preview-container" id="previewArea">
            <span class="placeholder-text" id="placeholderText">ছবির প্রিভিউ এখানে দেখা যাবে (ব্যাকগ্রাউন্ড #D9F0FA)</span>
            <canvas id="imageCanvas"></canvas>
        </div>

        <!-- Download Button -->
        <button class="btn btn-success" id="downloadBtn" style="display: none;">ছবি ডাউনলোড করুন</button>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const imageCanvas = document.getElementById('imageCanvas');
        const ctx = imageCanvas.getContext('2d');
        const placeholderText = document.getElementById('placeholderText');
        const downloadBtn = document.getElementById('downloadBtn');

        let uploadedImage = new Image();

        imageInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImage.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        uploadedImage.onload = function() {
            // Set precise canvas dimensions matching original proportions
            imageCanvas.width = uploadedImage.width;
            imageCanvas.height = uploadedImage.height;

            // Fill background with light sky-blue (#D9F0FA)
            ctx.fillStyle = '#D9F0FA';
            ctx.fillRect(0, 0, imageCanvas.width, imageCanvas.height);

            // Draw original photo over it
            ctx.drawImage(uploadedImage, 0, 0);

            // Hide placeholder and show download button
            placeholderText.style.display = 'none';
            downloadBtn.style.display = 'block';
        };

        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'photo-studio-pro-output.png';
            link.href = imageCanvas.toDataURL('image/png');
            link.click();
        });
    </script>

</body>
</html>
